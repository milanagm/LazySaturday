version: '3.9'

services:
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - '5173:80'
    depends_on:
      - backend

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    environment:
      - DIET_N8N_BASE_URL=http://n8n:5678
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis
      - n8n

  n8n:
    image: n8nio/n8n:latest
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n
      - DB_POSTGRESDB_HOST=postgres
      - N8N_ENCRYPTION_KEY=local-dev-key
    ports:
      - '5678:5678'
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=dietplanner
      - POSTGRES_USER=dp
      - POSTGRES_PASSWORD=dp
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'
